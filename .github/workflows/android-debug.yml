name: Build Android debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: npm install
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ already exists, skipping cap add"
          fi

      - name: Patch Android project
        run: npm run android:patch

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Use the project debug keystore
        run: |
          mkdir -p ~/.android
          cp resources/debug.keystore ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | head -5

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK is signed
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          # jarsigner -verify works for v1; apksigner if available
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$APK" || true
          fi
          python3 - <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile("android/app/build/outputs/apk/debug/app-debug.apk")
          names = z.namelist()
          has_v1 = any(n.startswith("META-INF/") and (n.endswith(".RSA") or n.endswith(".SF") or n=="META-INF/MANIFEST.MF") for n in names)
          # v2/v3 signing lives outside central directory; just ensure APK is valid zip with manifest+dex
          ok = "AndroidManifest.xml" in names and any(n.endswith(".dex") for n in names)
          print("valid_structure:", ok, "has_v1_meta:", has_v1)
          if not ok:
            sys.exit(1)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enugu-bus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
