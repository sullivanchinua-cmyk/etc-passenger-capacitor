name: Build Android debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Fixed: do NOT use android-actions/setup-android (fails on obsolete "tools" package)
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: npm install
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ already exists, skipping cap add"
          fi

      # Required for white-strip / white-flash fix (native window background #DCDDE0)
      - name: Patch Android project
        run: npm run android:patch

      # Same as "npm run sync" (postinstall already ran build-offline)
      - name: Sync web files into Android
        run: npx cap sync android

      - name: Use the project debug keystore
        run: |
          mkdir -p ~/.android
          cp resources/debug.keystore ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | head -3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enugu-bus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
