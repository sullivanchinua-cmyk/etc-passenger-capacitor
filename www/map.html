<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <script src="js/spa.js"></script>
  <script src="js/safe-area.js"></script>
  <script src="js/render-guard.js"></script>
  <script src="native/deeplink.js"></script>
  <title>ETC – Map</title>
  <link rel="stylesheet" href="css/tailwind.css" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s)">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'" />
  <link rel="stylesheet" href="vendor/fonts/plus-jakarta-sans.css" onerror="this.onerror=null;this.href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap'">
  <script>
    window.tailwind=window.tailwind||{};tailwind.config = { theme: { extend: {
      colors: { soft: { 100: '#DCDDE0', 200: '#D2D3D6', 300: '#E3E4E6' }, ink: '#111112', mute: '#8A8C90', navy: '#0B0F3A' }
    } } }
  </script>
  <link rel="stylesheet" href="css/styles.css" />


<style id="etc-anti-zoom-select">
html,body{touch-action:manipulation;overscroll-behavior-y:auto;-webkit-text-size-adjust:100%}
/* allow vertical scroll everywhere */
#chatMessages,.chat-messages,[data-chat-msgs],.msgs,main,.page,body,html{
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:auto;
}
html,body,*{-webkit-user-select:none!important;-moz-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
input,textarea,[contenteditable="true"],.selectable,.ref-id,[data-selectable],#refId,.ticket-ref,.reference-id,[class*="ref-id"],[class*="reference"]{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}
</style>
<script>
(function(){
  // Block pinch zoom only — do NOT block single-finger scroll
  document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('touchmove',function(e){
    if (e.touches && e.touches.length > 1) e.preventDefault();
  },{passive:false});
  // Do not preventDefault on touchend — that breaks scroll
})();
</script>

</head>
<body class="min-h-screen">
  <div id="liveMap"></div>

  <!-- live coordinates -->
  <div class="m-chip" aria-live="polite">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    <div>
      <p id="coords" class="c1">Locating you…</p>
      <p id="acc" class="c2">Allow location access</p>
    </div>
  </div>
  <button id="locateBtn" type="button" class="m-locate" aria-label="Centre on my location">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>

  <!-- booked + saved routes -->
  <section id="sheet" class="m-sheet" aria-label="Booked and saved routes">
    <button id="handle" type="button" class="m-handle" aria-label="Expand list"></button>
    <div class="m-head"><h2>Booked &amp; saved</h2><button id="seeMore" type="button" hidden>See more</button></div>
    <div id="list" class="m-list"></div>
  </section>

<nav class="etc-nav no-anim" data-active="1" style="--i:1" aria-label="Main">
    <span class="indicator" aria-hidden="true"></span>
    <a href="index.html" class="etc-tab" aria-label="Home">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="label">Home</span>
    </a>
    <a href="map.html" class="etc-tab is-active" aria-label="Map" aria-current="page">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <span class="label">Map</span>
    </a>
    <a href="events.html" class="etc-tab" aria-label="Events">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="17" rx="3.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/><circle class="dot" cx="8" cy="14.2" r="1.15"/><circle class="dot" cx="12" cy="14.2" r="1.15"/><circle class="dot" cx="16" cy="14.2" r="1.15"/><circle class="dot" cx="8" cy="18" r="1.15"/><circle class="dot" cx="12" cy="18" r="1.15"/><circle class="dot" cx="16" cy="18" r="1.15"/></svg>
      <span class="label">Events</span>
    </a>
  </nav>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script>window.L||document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>')</script>
  <script src="js/map-fix.js"></script>
  <script src="js/data.js"></script>
  <script src="js/fares-live.js"></script>
  <script src="js/chat-bridge.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
