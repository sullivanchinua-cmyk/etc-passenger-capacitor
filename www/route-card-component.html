<!-- ETC route card – terminal photo layered behind the 3D bus (Tailwind CSS)
     Needs the Tailwind CDN plus, from css/styles.css: .frost, .slide-track, .slide-dots
     and the 8-line slider in js/home.js (only for cards with more than one photo).

     1) Holy Ghost card: 3 terminal photos side by side, sliding horizontally -->
<article class="card bg-soft-300 rounded-[26px] border border-white/50 p-3 shadow-sm" data-from="Holy Ghost" data-to="Emene" data-fare="500">
  <div class="media relative overflow-hidden rounded-2xl w-full h-52 bg-gray-100 mb-2.5" data-slides="3">
  <div class="slide-track absolute inset-0 flex">
    <div class="relative shrink-0 w-full h-full overflow-hidden bg-gradient-to-br from-slate-200 to-slate-400">
      <img src="assets/terminals/holy-ghost-1-bg.jpg" alt="" loading="lazy" decoding="async" onerror="this.remove()" class="absolute inset-0 w-full h-full object-cover " />
    </div>
    <div class="relative shrink-0 w-full h-full overflow-hidden bg-gradient-to-br from-slate-200 to-slate-400">
      <img src="assets/terminals/holy-ghost-2-bg.jpg" alt="" loading="lazy" decoding="async" onerror="this.remove()" class="absolute inset-0 w-full h-full object-cover " />
    </div>
    <div class="relative shrink-0 w-full h-full overflow-hidden bg-gradient-to-br from-slate-200 to-slate-400">
      <img src="assets/terminals/holy-ghost-3-bg.jpg" alt="" loading="lazy" decoding="async" onerror="this.remove()" class="absolute inset-0 w-full h-full object-cover " />
    </div>
  </div>
  <div class="relative z-10 w-full h-full flex items-center justify-center p-2 pointer-events-none">
    <img src="assets/bus-shadow.png" alt="ETC Bus" decoding="async" class="max-h-full max-w-full object-contain" />
  </div>
  <span class="rating-badge frost z-20 absolute top-3 left-3 h-9 px-3 rounded-full flex items-center gap-1.5 text-[13px] font-semibold text-ink"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.7L12 17.5l-6 3.4 1.3-6.7-5-4.7 6.8-.8z" fill="#000"/></svg>5.0</span>
  <button class="bookmark-btn frost z-20 absolute top-3 right-3 w-9 h-9 rounded-full flex items-center justify-center" aria-label="Save route" aria-pressed="false">
    <svg width="15" height="15" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
  </button>
  <div class="slide-dots absolute bottom-2 left-1/2 -translate-x-1/2 z-20 flex gap-1.5"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</div>
  <div class="flex justify-between items-end gap-2">
    <div class="min-w-0">
      <p class="text-[17px] font-bold uppercase leading-snug">Holy Ghost → Emene</p>
      <p class="text-sm font-semibold mt-0.5">₦500 <span class="text-mute font-medium">· 7 routes</span></p>
    </div>
    <button class="view-btn bg-ink text-white text-[13px] font-medium rounded-full px-4 py-2.5 whitespace-nowrap shrink-0">View details</button>
  </div>
</article>
