<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <script src="js/spa.js"></script>
  <script src="js/safe-area.js"></script>
  <script src="js/render-guard.js"></script>
  <script src="native/deeplink.js"></script>
<title>ETC – Assistant</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/ai.css" />


<style id="etc-anti-zoom-select">
html,body{touch-action:manipulation;overscroll-behavior-y:auto;-webkit-text-size-adjust:100%}
/* allow vertical scroll everywhere */
#chatMessages,.chat-messages,[data-chat-msgs],.msgs,main,.page,body,html{
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:auto;
}
html,body,*{-webkit-user-select:none!important;-moz-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
input,textarea,[contenteditable="true"],.selectable,.ref-id,[data-selectable],#refId,.ticket-ref,.reference-id,[class*="ref-id"],[class*="reference"]{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}
</style>
<script>
(function(){
  // Block pinch zoom only — do NOT block single-finger scroll
  document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('touchmove',function(e){
    if (e.touches && e.touches.length > 1) e.preventDefault();
  },{passive:false});
  // Do not preventDefault on touchend — that breaks scroll
})();
</script>

</head>
<body class="etc-sa-own">
  <div class="ai-page">
    <!-- glow backdrop -->
    <div class="ai-glow ai-glow-a" aria-hidden="true"></div>
    <div class="ai-glow ai-glow-b" aria-hidden="true"></div>

    <header class="ai-head">
      <button id="aiBack" type="button" class="ai-circle" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="ai-head-txt">
        <h1>ETC Assistant<span class="ai-beta">BETA</span></h1>
        <p id="aiSub">Voice help for your trip</p>
      </div>
      <button id="aiVoiceBtn" type="button" class="ai-circle" aria-label="Change assistant voice">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13" width="4.5" height="7" rx="2"/><rect x="17" y="13" width="4.5" height="7" rx="2"/></svg>
      </button>
      <div class="ai-quota" id="aiQuota" role="status" aria-live="polite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
        <b id="aiQuotaN">5</b>
      </div>
    </header>

    <main class="ai-log" id="aiLog" aria-live="polite"></main>

    <div class="ai-chips" id="aiChips">
      <button type="button" class="ai-chip" data-q="What's the fare from Holy Ghost to Emene?">Check a fare</button>
      <button type="button" class="ai-chip" data-q="Book me a ticket">Book a ticket</button>
      <button type="button" class="ai-chip" data-q="Where is my bus right now?">Track my bus</button>
      <button type="button" class="ai-chip" data-q="Can I change my seat?">Change my seat</button>
      <button type="button" class="ai-chip" data-q="I want to talk to support">Talk to support</button>
    </div>

    <p class="ai-status" id="aiStatus"></p>

    <form class="ai-input-row" id="aiForm">
      <input id="aiText" type="text" placeholder="Message or tap the mic…" autocomplete="off" enterkeyhint="send" />
      <button type="button" class="ai-mic" id="aiMic" aria-label="Talk">
        <i class="ai-mic-ring"></i>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
      </button>
      <button type="submit" class="ai-send" id="aiSend" aria-label="Send" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6.5 16-2.8-6.7L4 12z"/></svg>
      </button>
    </form>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/fares-live.js"></script>
  <script src="js/chat-bridge.js"></script>
  <script src="js/slots.js"></script>
  <script src="js/ai.js"></script>
</body>
</html>
