<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="js/safe-area.js"></script>
  <script src="js/render-guard.js"></script>
  <meta name="theme-color" content="#0B0F3A" />
  <title>Offline – ETC Bus</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: #0B0F3A; color: #e2e8f0; padding: 24px;
    }
    img { max-width: 180px; margin-bottom: 20px; opacity: 0.9; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; opacity: 0.8; font-size: 0.95rem; line-height: 1.45; max-width: 280px; }
    button {
      background: #fff; color: #0B0F3A; border: 0; border-radius: 999px;
      padding: 12px 22px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="icons/icon-192.png" alt="ETC" width="96" height="96" />
  <h1>You’re offline</h1>
  <p>Check your connection. Saved tickets and recent pages may still work.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
