<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ETC – Route details</title>
  <link rel="stylesheet" href="css/tailwind.css" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s)">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'" />
  <link rel="stylesheet" href="vendor/fonts/plus-jakarta-sans.css" onerror="this.onerror=null;this.href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap'">
  <script>
    window.tailwind=window.tailwind||{};tailwind.config = { theme: { extend: {
      colors: { soft: { 100: '#DCDDE0', 200: '#D2D3D6', 300: '#E3E4E6' }, ink: '#111112', mute: '#8A8C90', navy: '#0B0F3A' }
    } } }
  </script>
  <link rel="stylesheet" href="css/styles.css" />


<style id="etc-anti-zoom-select">
html,body{touch-action:manipulation;overscroll-behavior-y:auto;-webkit-text-size-adjust:100%}
/* allow vertical scroll everywhere */
#chatMessages,.chat-messages,[data-chat-msgs],.msgs,main,.page,body,html{
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:auto;
}
html,body,*{-webkit-user-select:none!important;-moz-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
input,textarea,[contenteditable="true"],.selectable,.ref-id,[data-selectable],#refId,.ticket-ref,.reference-id,[class*="ref-id"],[class*="reference"]{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}
</style>
<script>
(function(){
  // Block pinch zoom only — do NOT block single-finger scroll
  document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('touchmove',function(e){
    if (e.touches && e.touches.length > 1) e.preventDefault();
  },{passive:false});
  // Do not preventDefault on touchend — that breaks scroll
})();
</script>

</head>
<body class="min-h-screen text-ink">
  <button id="backBtn" class="back-btn" type="button" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
  <div class="max-w-[430px] mx-auto">

    <!-- MAP: tap or double-tap to open full screen, again to close -->
    <div id="mapWrap" class="d-map-wrap">
      <div id="dMap"></div>
      <div class="d-hint">Tap the map to close</div>
    </div>

    <section class="d-sheet">
      <div class="d-handle"></div>

      <!-- location names -->
      <div class="d-fields">
        <div class="d-field">
          <svg class="ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v6M15 6v6M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg>
          <div><p class="lbl">From</p><p id="fromName" class="val">–</p></div>
        </div>
        <div class="d-field">
          <svg class="ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <div><p class="lbl">To</p><p id="toName" class="val">–</p></div>
        </div>
        <button id="swapBtn" type="button" class="d-swap" aria-label="Swap direction">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 19V5M8 5L4.5 8.5M16 5v14M16 19l3.5-3.5"/></svg>
        </button>
      </div>

      <!-- estimates: you → destination -->
      <div class="d-sec-head">
        <div>
          <h2>Travel time</h2>
          <p id="estSub">Locating you…</p>
        </div>
        <button id="moreBtn" type="button" class="more-btn">View more</button>
      </div>
      <div id="estMain" class="est-grid"></div>

      <div class="d-amount"><span>Amount</span><b id="amount">–</b></div>
      <button id="bookBtn" type="button" class="book-btn">Book ticket</button>
    </section>
  </div>

  <!-- overlay -->
  <div id="ov" class="ov" aria-hidden="true">
    <div class="ov-card" role="dialog" aria-label="More travel times">
      <button id="ovClose" type="button" class="ov-close" aria-label="Close">
        <svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="ovBody"></div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script>window.L||document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>')</script>
  <script src="js/data.js"></script>
  <script src="js/fares-live.js"></script>
  <script src="js/chat-bridge.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/slots.js"></script>
  <script src="js/details.js"></script>
</body>
</html>
