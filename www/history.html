<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <script src="js/safe-area.js"></script>
  <title>Receipt History | ETC</title>
  <link rel="stylesheet" href="css/tailwind.css" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s)">
  <link rel="stylesheet" href="vendor/fonts/plus-jakarta-sans.css" onerror="this.onerror=null;this.href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap'">
  <script>
    window.tailwind=window.tailwind||{};tailwind.config = { theme: { extend: {
      colors: { soft: { 100: '#DCDDE0', 200: '#D2D3D6', 300: '#E3E4E6' }, ink: '#111112', mute: '#8A8C90', navy: '#0B0F3A' }
    } } }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .hist-list { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 100px; }
    .hist-card {
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(11,15,58,0.06);
    }
    .hist-card .route { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
    .hist-card .meta { font-size: 12.5px; color: var(--mute); font-weight: 500; margin-top: 4px; }
    .hist-card .fare { font-size: 18px; font-weight: 800; color: var(--navy); }
    .hist-actions { display: flex; gap: 8px; margin-top: 12px; }
    .hist-actions button {
      flex: 1; height: 40px; border-radius: 12px; border: 0; font: 700 13px var(--font); cursor: pointer;
    }
    .hist-actions .view { background: var(--navy); color: #fff; }
    .hist-actions .dl { background: #F1F2F4; color: var(--ink); }
    .empty { text-align: center; padding: 60px 24px; color: var(--mute); }
    .empty h3 { font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
    /* Receipt print sheet – thermal / normal size ~80mm look */
    .receipt-sheet {
      width: 320px;
      max-width: 92vw;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      padding: 20px 18px 24px;
      font-family: 'Courier New', ui-monospace, monospace;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      color: #111;
    }
    .receipt-sheet .brand {
      text-align: center;
      border-bottom: 1.5px dashed #ccc;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .receipt-sheet .brand img { width: 64px; height: auto; margin: 0 auto 8px; display: block; }
    .receipt-sheet .brand h2 { font-size: 15px; font-weight: 800; letter-spacing: 0.06em; margin: 0; font-family: var(--font); }
    .receipt-sheet .brand p { font-size: 10px; color: #666; margin: 2px 0 0; font-family: var(--font); }
    .receipt-row { display: flex; justify-content: space-between; font-size: 12px; margin: 5px 0; }
    .receipt-row.total { font-weight: 800; font-size: 14px; border-top: 1.5px dashed #ccc; padding-top: 8px; margin-top: 10px; }
    .receipt-foot { text-align: center; font-size: 10px; color: #888; margin-top: 14px; border-top: 1.5px dashed #ccc; padding-top: 10px; font-family: var(--font); }
  </style>


<style id="etc-anti-zoom-select">
html,body{touch-action:manipulation;overscroll-behavior-y:auto;-webkit-text-size-adjust:100%}
/* allow vertical scroll everywhere */
#chatMessages,.chat-messages,[data-chat-msgs],.msgs,main,.page,body,html{
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:auto;
}
html,body,*{-webkit-user-select:none!important;-moz-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
input,textarea,[contenteditable="true"],.selectable,.ref-id,[data-selectable],#refId,.ticket-ref,.reference-id,[class*="ref-id"],[class*="reference"]{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}
</style>
<script>
(function(){
  // Block pinch zoom only — do NOT block single-finger scroll
  document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('touchmove',function(e){
    if (e.touches && e.touches.length > 1) e.preventDefault();
  },{passive:false});
  // Do not preventDefault on touchend — that breaks scroll
})();
</script>

</head>
<body class="min-h-screen text-ink">
  <div class="max-w-[430px] mx-auto">
    <header class="flex items-center gap-3 px-4 pt-4 pb-3">
      <a href="index.html" class="frost w-10 h-10 rounded-full flex items-center justify-center" aria-label="Back">
        <svg class="ico" width="18" height="18" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </a>
      <h1 class="page-title text-xl font-extrabold">Receipt History</h1>
    </header>

    <div id="histList" class="hist-list"></div>
  </div>

  <!-- Receipt viewer overlay -->
  <div id="rcptOv" class="ov" aria-hidden="true">
    <div style="max-height:90dvh;overflow:auto;padding:16px 0">
      <div id="rcptMount"></div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;padding:0 20px">
        <button type="button" id="rcptDl" class="alarm-btn primary" style="flex:1;max-width:160px">Download PDF</button>
        <button type="button" id="rcptClose" class="alarm-btn secondary" style="flex:1;max-width:120px">Close</button>
      </div>
    </div>
  </div>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script>window.jspdf||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>')</script>
  <script src="js/firebase-config.js"></script>
  <script src="vendor/v10/firebase-app-compat.js"></script>
  <script>window.firebase||document.write('<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"><\/script>')</script>
  <script src="vendor/v10/firebase-auth-compat.js"></script>
  <script>window.firebase&&firebase.auth||document.write('<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"><\/script>')</script>
  <script src="vendor/v10/firebase-firestore-compat.js"></script>
  <script>window.firebase&&firebase.firestore||document.write('<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"><\/script>')</script>
  <script src="js/firebase-init.js"></script>
  <script src="native/loader.js"></script>
  <script src="js/lib.js"></script>
  <script src="js/store.js"></script>
  <script src="js/tokens.js"></script>
  <script src="js/tickets.js"></script>
  <script>
    // Real receipts from local tickets + Firebase (no mock data)
    const KEY = "etc_receipts";
    let list = [];
    const el = document.getElementById("histList");

    function renderHist() {
      if (!list.length) {
        el.innerHTML = `<div class="empty"><h3>No receipts yet</h3><p>Tickets you buy will appear here.</p></div>`;
        return;
      }
      el.innerHTML = list.map((r, i) => `
        <article class="hist-card">
          <div class="flex justify-between items-start">
            <div>
              <div class="route">${r.from} → ${r.to}</div>
              <div class="meta">${r.date}${r.time ? " · " + r.time : ""} · ${r.seats} seat${r.seats > 1 ? "s" : ""}</div>
              <div class="meta">${r.id}${r.status === "Used" ? ' · <span style="color:#E11D48;font-weight:800">USED</span>' : ""}</div>
            </div>
            <div class="fare">₦${Number(r.fare).toLocaleString()}</div>
          </div>
          <div class="hist-actions">
            <button type="button" class="view" data-i="${i}">View receipt</button>
            <button type="button" class="dl" data-i="${i}">Download</button>
          </div>
        </article>`).join("");
    }

    async function loadHistory() {
      el.innerHTML = `<div class="empty"><p>Loading…</p></div>`;
      let tickets = [];
      try {
        if (window.ETC_Store && window.ETC_Store.listTickets) tickets = await window.ETC_Store.listTickets();
        else tickets = JSON.parse(localStorage.getItem("etc_tickets") || "[]");
      } catch (_) {}
      try {
        if (window.ETC_Tickets && window.ETC_Tickets.pullMyTickets) {
          const cloud = await window.ETC_Tickets.pullMyTickets();
          if (cloud && cloud.length) tickets = tickets.concat(cloud);
        }
      } catch (e) { console.warn(e); }
      const byRef = {};
      const today = (function(){ const n=new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0"); })();
      tickets.forEach((t) => {
        const ref = t.reference || t.id;
        if (!byRef[ref]) {
          byRef[ref] = { id: ref, from: t.from, to: t.to, fare: t.total || t.fare || 0, date: t.date || "", time: t.time || "", seats: 0, status: "Paid", tickets: [] };
        }
        byRef[ref].seats += 1;
        byRef[ref].tickets.push(t);
        if (t.total) byRef[ref].fare = t.total;
        const st = (t.status || "").toLowerCase();
        if (st === "boarded" || st === "used" || (t.date && t.date < today)) byRef[ref].status = "Used";
      });
      list = Object.values(byRef).sort((a, b) => String(b.date).localeCompare(String(a.date)));
      try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (_) {}
      renderHist();
    }
    // wait a tick for firebase/store scripts
    setTimeout(loadHistory, 400);

    function buildReceiptHTML(r) {
      return `
        <div class="receipt-sheet" id="receiptPrint">
          <div class="brand">
            <img src="assets/bus.png" alt="ECT Bus" onerror="this.style.display='none'" />
            <h2>COAL CITY BUS · ETC</h2>
            <p>Enugu Transit Control</p>
            <p>Official Passenger Receipt</p>
          </div>
          <div class="receipt-row"><span>Receipt No.</span><span>${r.id}</span></div>
          <div class="receipt-row"><span>Date</span><span>${r.date}</span></div>
          <div class="receipt-row"><span>Time</span><span>${r.time}</span></div>
          <div class="receipt-row"><span>From</span><span>${r.from}</span></div>
          <div class="receipt-row"><span>To</span><span>${r.to}</span></div>
          <div class="receipt-row"><span>Seats</span><span>${r.seats}</span></div>
          <div class="receipt-row"><span>Status</span><span>${r.status || "Paid"}</span></div>
          <div class="receipt-row total"><span>TOTAL</span><span>₦${Number(r.fare).toLocaleString()}</span></div>
          <div class="receipt-foot">
            Thank you for riding with Coal City Bus<br/>
            Keep this receipt for your records<br/>
            etc.enugu.gov · support@etc.ng
          </div>
        </div>`;
    }

    let current = null;
    const ov = document.getElementById("rcptOv");
    const mount = document.getElementById("rcptMount");

    function showReceipt(r) {
      current = r;
      mount.innerHTML = buildReceiptHTML(r);
      ov.classList.add("show");
      ov.setAttribute("aria-hidden", "false");
    }
    document.getElementById("rcptClose").onclick = () => {
      ov.classList.remove("show");
      ov.setAttribute("aria-hidden", "true");
    };
    ov.addEventListener("click", (e) => { if (e.target === ov) document.getElementById("rcptClose").click(); });

    async function downloadPDF(r) {
      const { jsPDF } = window.jspdf;
      // Thermal-ish size: 80mm width ≈ 226 pt, height auto
      const doc = new jsPDF({ unit: "pt", format: [226, 420] });
      const margin = 16;
      let y = 20;

      // Bus image if possible
      try {
        const img = new Image();
        img.crossOrigin = "anonymous";
        await new Promise((res, rej) => {
          img.onload = res; img.onerror = rej;
          img.src = "assets/bus.png";
        });
        doc.addImage(img, "PNG", 226 / 2 - 28, y, 56, 36);
        y += 42;
      } catch (_) { y += 8; }

      doc.setFont("helvetica", "bold");
      doc.setFontSize(11);
      doc.text("COAL CITY BUS · ETC", 113, y, { align: "center" });
      y += 12;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      doc.text("Enugu Transit Control", 113, y, { align: "center" });
      y += 10;
      doc.text("Official Passenger Receipt", 113, y, { align: "center" });
      y += 8;
      doc.setDrawColor(180);
      doc.setLineDash([2, 2]);
      doc.line(margin, y, 226 - margin, y);
      y += 14;
      doc.setLineDash([]);

      const rows = [
        ["Receipt No.", r.id],
        ["Date", r.date],
        ["Time", r.time],
        ["From", r.from],
        ["To", r.to],
        ["Seats", String(r.seats)],
        ["Status", r.status || "Paid"]
      ];
      doc.setFontSize(9);
      rows.forEach(([k, v]) => {
        doc.setFont("helvetica", "normal");
        doc.text(k, margin, y);
        doc.setFont("helvetica", "bold");
        doc.text(String(v), 226 - margin, y, { align: "right" });
        y += 14;
      });
      y += 4;
      doc.setLineDash([2, 2]);
      doc.line(margin, y, 226 - margin, y);
      y += 16;
      doc.setLineDash([]);
      doc.setFontSize(11);
      doc.setFont("helvetica", "bold");
      doc.text("TOTAL", margin, y);
      doc.text("₦" + Number(r.fare).toLocaleString(), 226 - margin, y, { align: "right" });
      y += 20;
      doc.setLineDash([2, 2]);
      doc.line(margin, y, 226 - margin, y);
      y += 14;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(7);
      doc.setTextColor(100);
      doc.text("Thank you for riding with Coal City Bus", 113, y, { align: "center" });
      y += 10;
      doc.text("Keep this receipt for your records", 113, y, { align: "center" });
      y += 10;
      doc.text("etc.enugu.gov · support@etc.ng", 113, y, { align: "center" });

      doc.save(`${r.id}.pdf`);
    }

    el.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-i]");
      if (!b) return;
      const r = list[+b.dataset.i];
      if (!r) return;
      if (b.classList.contains("view")) showReceipt(r);
      else downloadPDF(r);
    });
    document.getElementById("rcptDl").onclick = () => { if (current) downloadPDF(current); };
  </script>
